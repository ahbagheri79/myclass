    <header>
        <div onclick="openMenu()" class="mobile-menu-hamberger" aria-label="منوی موبایل">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

                <path d="M20 17H17M4 17L13 17" stroke="#1C274C" stroke-width="1.5" stroke-linecap="round" />

        <img class="logo" src="typo.webp" height="66" alt="لوگوی سایت">

        <nav aria-label="منوی اصلی">

                <span>category</span>

                    <li>product</li>

        <a href="/contact-us" class="href">مشاوره</a>

    <main class="login-area">
        <form class="login-form" action="#" method="post">
            <div class="login-icon" aria-hidden="true">م</div>
            <h1>ورود به حساب کاربری</h1>
            <p class="login-description">اطلاعات حساب خود را وارد کنید.</p>

            <div class="form-field">
                <label for="username">نام کاربری</label>
                <input type="text" id="username" name="username" placeholder="نام کاربری" autocomplete="username"
                    required>
            </div>

            <div class="form-field">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" name="password" placeholder="رمز عبور"
                    autocomplete="current-password" required>
            </div>

            <div class="form-options">
                <label class="remember" for="remember">
                    <input type="checkbox" id="remember" name="remember">
                    <span>مرا به خاطر بسپار</span>
                </label>
                <a href="#">رمز عبور را فراموش کرده‌اید؟</a>
            </div>

            <button type="submit" onclick="login()">ورود</button>
            <p class="signup-text">حساب ندارید؟ <a href="#">ثبت‌نام کنید</a></p>
        </form>
    </main>
